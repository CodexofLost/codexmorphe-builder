[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codexmorphe-builder"
version = "0.1.0"
description = "Automated MPP Ingestion, AST Transpiler, and Per-App Bundle Builder for CodexMorphe"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [
    {name = "CodexMorphe Contributors"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux"
]

[project.scripts]
codexmorphe-builder = "codexmorphe_builder.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codexmorphe_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
