name: Build & Publish Bundles (Rolling Release)

on:
  schedule:
    # Run every 6 hours to fetch new .mpp releases
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild all bundles (ignore cache ledger)"
        required: false
        type: boolean
        default: false
      source:
        description: "Specific source ID to build (optional, e.g. official)"
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "sources/**"
      - "codexmorphe_builder/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK Build-Tools & Platform (d8, aapt2, android.jar)
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS_DIR" ]; then
            echo "Installing build-tools 34.0.0 via sdkmanager..."
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          fi
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

          PLATFORM_DIR="${ANDROID_HOME}/platforms/android-34"
          if [ ! -f "$PLATFORM_DIR/android.jar" ]; then
            echo "Installing platforms;android-34..."
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34"
          fi

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover tests -v

      - name: Restore Cache Ledger & MPP Archives
        uses: actions/cache@v4
        with:
          path: |
            .cache/
          key: codexmorphe-cache-${{ hashFiles('sources/*.json') }}-${{ github.run_id }}
          restore-keys: |
            codexmorphe-cache-${{ hashFiles('sources/*.json') }}-
            codexmorphe-cache-

      - name: Fetch Upstream Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOURCE_FLAG=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            SOURCE_FLAG="--source ${{ github.event.inputs.source }}"
          fi
          python3 -m codexmorphe_builder fetch $SOURCE_FLAG

      - name: Compile Per-App Bundles (Delta Build)
        env:
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_TAG: "bundles"
        run: |
          # Ensure dist/ workspace is clean of any legacy or unflavored artifacts
          rm -rf dist/
          mkdir -p dist/
          # Download existing release manifest so incremental builds retain all existing applications
          gh release download bundles -p "bundle-manifest.json" -D dist/ 2>/dev/null || true

          BUILD_FLAGS="--changed-only"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            echo "Trigger is push or force_rebuild: compiling all bundles with latest builder..."
            BUILD_FLAGS="--all"
          fi
          if [ -n "${{ github.event.inputs.source }}" ]; then
            BUILD_FLAGS="$BUILD_FLAGS --source ${{ github.event.inputs.source }}"
          fi
          python3 -m codexmorphe_builder build $BUILD_FLAGS

      - name: Publish to Rolling 'bundles' Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Ensure canonical 'bundles' release tag exists
          if ! gh release view bundles >/dev/null 2>&1; then
            echo "Creating initial 'bundles' rolling release tag..."
            gh release create bundles \
              --title "CodexMorphe Active Bundles" \
              --notes "Automated rolling release of per-app patch bundles and bundle-manifest.json. Updated every 6 hours."
          fi

          # Resilient asset upload helper with retry and conflict deletion
          upload_asset() {
            local file="$1"
            local name
            name="$(basename "$file")"
            for attempt in 1 2 3; do
              if gh release upload bundles "$file" --clobber 2>/dev/null; then
                return 0
              fi
              echo "Retrying $name (attempt $attempt)..."
              gh release delete-asset bundles "$name" -y 2>/dev/null || true
              sleep 1
              if gh release upload bundles "$file" 2>/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Warning: Could not upload $name after 3 attempts."
            return 0
          }

          # 2. Upload manifest catalog only if valid and non-empty
          if [ -f "dist/bundle-manifest.json" ]; then
            APPS_COUNT=$(python3 -c "import json; print(len(json.load(open('dist/bundle-manifest.json')).get('apps', {})))" 2>/dev/null || echo 0)
            if [ "$APPS_COUNT" -gt 0 ]; then
              echo "Upserting dist/bundle-manifest.json ($APPS_COUNT apps)..."
              upload_asset "dist/bundle-manifest.json"
            else
              echo "CRITICAL: dist/bundle-manifest.json contains 0 apps! Skipping upload to protect existing release manifest."
            fi
          fi

          # 3. Upload compiled author-flavored bundles with in-place upsert
          for apk in dist/*-*-bundle.apk; do
            if [ -f "$apk" ]; then
              echo "Upserting $apk..."
              upload_asset "$apk"
            fi
          done

          # 4. Upload updated manifest catalog again to ensure latest hashes and timestamps
          if [ -f "dist/bundle-manifest.json" ]; then
            APPS_COUNT=$(python3 -c "import json; print(len(json.load(open('dist/bundle-manifest.json')).get('apps', {})))" 2>/dev/null || echo 0)
            if [ "$APPS_COUNT" -gt 0 ]; then
              echo "Final upsert of dist/bundle-manifest.json ($APPS_COUNT apps)..."
              upload_asset "dist/bundle-manifest.json"
            fi
          fi
          echo "✓ Rolling release update complete."
